name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # --legacy-peer-deps: netlify-cli's @netlify/build pulls in an
      # opentelemetry chain pinned to ~1.8.0, while vitest's optional peer on
      # @opentelemetry/api wants ^1.9.0. Both are satisfied at runtime; only
      # npm's strict peer resolution objects, and a legacy-peer-deps install
      # is what produced this lockfile.
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run build:ui
      - run: npm run build-storybook --workspace lause-ds
      - run: npm run build:tokens
      - run: npm run build:manifest
      - run: npm run build:mcp
      - name: fail if generated files drifted
        run: git add -A tokens packages/ui/src/tokens figma components.manifest.json llms.txt && git diff --cached --exit-code -- tokens packages/ui/src/tokens figma components.manifest.json llms.txt
      - run: npm test
