[build]
  command = "npm run build:tokens && npm run build:manifest && npm run build:ui && npm run build:mcp && npm run build:site"
  publish = "site"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  included_files = [
    "tokens/**",
    "components.manifest.json",
    "llms.txt",
    "figma/library.json",
    "packages/ui/src/tokens/theme.css",
    "packages/ui/src/**/*.tsx",
    "packages/ui/src/**/*.ts",
    "packages/mcp/package.json"
  ]
