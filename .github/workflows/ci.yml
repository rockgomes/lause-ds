name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build:tokens
      - run: npm run build:manifest
      - run: npm run build:mcp
      - run: npm run typecheck
      - run: npm run build:ui
      - run: npm run build:site
      - name: fail if generated files drifted
        run: git add -A tokens packages/ui/src/tokens figma components.manifest.json llms.txt && git diff --cached --exit-code -- tokens packages/ui/src/tokens figma components.manifest.json llms.txt
      - run: npm test
