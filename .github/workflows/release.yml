name: release
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  # Trusted publishing: the job proves its identity to npm with an OIDC
  # token, so no npm token is stored in the repo. Each package's trusted
  # publisher on npmjs.com names this repo and this workflow file.
  id-token: write
concurrency: release-${{ github.ref }}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Same order as ci.yml: the generated token files, the manifest and the
      # MCP dist all have to exist before typecheck and the tests run.
      - run: npm run build:tokens
      - run: npm run build:manifest
      - run: npm run build:mcp
      - run: npm run typecheck
      - run: npm run build:ui
      - run: npm test
      - name: version or publish
        uses: changesets/action@v1
        with:
          version: npm run version
          publish: npm run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
